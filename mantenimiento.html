<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JaviEats · Mantenimiento</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fafafa;
      color: #18181b;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .maintenance {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 28px;
      border-radius: 50%;
      background: #18181b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 7vw, 38px);
      font-weight: 700;
      letter-spacing: -1.2px;
    }

    p {
      margin: 14px 0 0;
      color: #71717a;
      font-size: 15px;
      line-height: 1.6;
    }

    .line {
      width: 42px;
      height: 3px;
      margin: 28px auto 0;
      border-radius: 99px;
      background: #e4e4e7;
      overflow: hidden;
    }

    .line::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      background: #18181b;
      animation: loading 1.4s ease-in-out infinite alternate;
    }

    @keyframes loading {
      from { transform: translateX(0); }
      to { transform: translateX(150%); }
    }
  </style>
</head>
<body>
  <main class="maintenance">
    <div class="icon">♥</div>
    <h1>Página en mantenimiento</h1>
    <p>
      Estamos haciendo unos pequeños cambios.<br>
      Volveremos pronto.
    </p>
    <div class="line"></div>
  </main>

  <script>
    const MAINTENANCE_UNTIL =
      new Date("2026-08-29T08:30:00+02:00").getTime();

    function checkMaintenance() {
      if (Date.now() >= MAINTENANCE_UNTIL) {
        window.location.replace("/");
      }
    }

    checkMaintenance();
    setInterval(checkMaintenance, 10000);
  </script>
</body>
</html>
