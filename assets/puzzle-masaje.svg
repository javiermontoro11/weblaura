<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Puzle del masaje JaviEats</title>
  <desc id="desc">Ilustración romántica para el premio de un masaje de treinta minutos.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="0.52" stop-color="#ffd8cf"/>
      <stop offset="1" stop-color="#f4a392"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff826b"/>
      <stop offset="1" stop-color="#d94939"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#7a2f25" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="900" height="600" rx="54" fill="url(#background)"/>
  <circle cx="755" cy="95" r="115" fill="#ffffff" opacity="0.24"/>
  <circle cx="92" cy="520" r="155" fill="#ffffff" opacity="0.18"/>
  <path d="M0 450 C180 382 302 520 470 457 C630 397 742 415 900 330 V600 H0 Z" fill="#fffaf3" opacity="0.44"/>

  <g opacity="0.3" fill="#b54437">
    <circle cx="120" cy="110" r="9"/>
    <circle cx="160" cy="78" r="5"/>
    <circle cx="790" cy="205" r="7"/>
    <circle cx="825" cy="245" r="4"/>
  </g>

  <g transform="translate(82 82)" filter="url(#shadow)">
    <rect width="736" height="430" rx="54" fill="#fffdf9" opacity="0.92"/>
    <rect x="22" y="22" width="692" height="386" rx="40" fill="none" stroke="#e85d45" stroke-width="3" stroke-dasharray="10 12" opacity="0.45"/>
  </g>

  <g transform="translate(155 160)">
    <path d="M123 43 C82 -2 0 17 0 88 C0 158 123 229 123 229 C123 229 246 158 246 88 C246 17 164 -2 123 43 Z" fill="url(#heart)"/>
    <path d="M61 87 C85 58 111 68 123 87 C137 65 167 56 189 82" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity="0.72"/>
    <path d="M62 138 C99 169 151 169 187 137" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity="0.72"/>
    <g transform="translate(34 196)" fill="#f6c4b7">
      <path d="M14 2 C34 -4 59 10 78 34 L105 69 C114 81 110 100 97 108 C83 116 65 111 57 98 L20 42 C10 27 5 11 14 2 Z"/>
      <path d="M198 2 C178 -4 153 10 134 34 L107 69 C98 81 102 100 115 108 C129 116 147 111 155 98 L192 42 C202 27 207 11 198 2 Z"/>
    </g>
  </g>

  <g transform="translate(442 178)" fill="#211d1a">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800" letter-spacing="5" fill="#a44235">JAVIEATS</text>
    <text x="0" y="84" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="900" letter-spacing="-3">MASAJE</text>
    <text x="3" y="142" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#e85d45">30 MINUTOS</text>
    <text x="3" y="207" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#76645d">Completa las 6 piezas</text>
    <text x="3" y="241" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#76645d">y desbloquea tu vale.</text>
  </g>

  <g transform="translate(448 451)" fill="#e85d45">
    <path d="M16 8 C10 -1 0 2 0 12 C0 22 16 32 16 32 C16 32 32 22 32 12 C32 2 22 -1 16 8 Z"/>
    <path d="M66 8 C60 -1 50 2 50 12 C50 22 66 32 66 32 C66 32 82 22 82 12 C82 2 72 -1 66 8 Z" opacity="0.58"/>
    <path d="M116 8 C110 -1 100 2 100 12 C100 22 116 32 116 32 C116 32 132 22 132 12 C132 2 122 -1 116 8 Z" opacity="0.32"/>
  </g>
</svg>
