<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f0ea">
<title>Nuestra Vida · JaviEats</title>
<style>
  :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#f4f0ea}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 12%,rgba(232,93,69,.16),transparent 30%),#f4f0ea}
  .gate{width:min(520px,100%);background:#fff;border:1px solid #e6ddd3;border-radius:28px;padding:30px;box-shadow:0 22px 60px rgba(44,31,25,.12);text-align:center}
  .mark{width:72px;height:72px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:#111;color:#e85d45;font-size:34px;font-weight:900}
  .eyebrow{margin:0 0 8px;text-transform:uppercase;letter-spacing:.13em;font-size:.7rem;font-weight:900;color:#e85d45}
  h1{font-size:2rem;letter-spacing:-.04em;margin:0 0 10px}p{color:#6f6a64;line-height:1.5;margin:0}
  .countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:24px 0}
  .countdown span{background:#f7f3ee;border-radius:16px;padding:14px 6px}.countdown strong{display:block;font-size:1.2rem}.countdown small{font-size:.65rem;color:#857d75}
  a{display:inline-flex;margin-top:8px;padding:12px 18px;border-radius:999px;background:#111;color:#fff;text-decoration:none;font-weight:800}
</style>
</head>
<body>
<main class="gate" id="gate">
  <div class="mark">♥↗</div>
  <p class="eyebrow">JaviEats</p>
  <h1>Nuestra Vida</h1>
  <p id="copy">Comprobando acceso…</p>
  <div class="countdown" id="countdown" hidden>
    <span><strong id="d">00</strong><small>días</small></span>
    <span><strong id="h">00</strong><small>horas</small></span>
    <span><strong id="m">00</strong><small>min</small></span>
    <span><strong id="s">00</strong><small>seg</small></span>
  </div>
  <a href="../" id="back" hidden>Volver a JaviEats</a>
</main>
<script>
(() => {
  "use strict";
  const RELEASE_AT = Date.parse("2026-09-12T12:00:00Z");
  const JAVI_ID = "ed529e36-5f68-4326-a658-00cfe22d4f01";
  const LAURA_ID = "ef4258bf-5897-4594-86ac-a134fcd1feec";
  const CORE = "./nv-core-1-0-8c6f2a.html";

  function safeGet(storage,key){try{return storage.getItem(key)}catch(_){return null}}
  function decodeSub(token){try{const p=token.split('.')[1];if(!p)return null;const n=p.replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(decodeURIComponent(atob(n).split('').map(c=>'%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')))?.sub||null}catch(_){return null}}
  function userId(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(!/^sb-.*-auth-token$/.test(k))continue;const raw=localStorage.getItem(k);if(!raw)continue;const data=JSON.parse(raw);const direct=data?.user?.id||data?.currentSession?.user?.id||data?.session?.user?.id;if(direct)return direct;const t=data?.access_token||data?.currentSession?.access_token||data?.session?.access_token;const sub=t?decodeSub(t):null;if(sub)return sub}}catch(_){}return null}
  function role(){const id=userId();if(id===JAVI_ID)return 'javi';if(id===LAURA_ID)return 'laura';const marker=safeGet(sessionStorage,'javieats:nv-role')||safeGet(localStorage,'javieats:nv-role');return marker==='javi'||marker==='laura'?marker:'unknown'}
  async function loadGame(){const response=await fetch(CORE,{cache:'no-store'});if(!response.ok)throw new Error('No se ha podido cargar Nuestra Vida');const html=await response.text();document.open();document.write(html);document.close()}
  function updateCountdown(){const diff=Math.max(0,RELEASE_AT-Date.now());const total=Math.floor(diff/1000);document.getElementById('d').textContent=String(Math.floor(total/86400)).padStart(2,'0');document.getElementById('h').textContent=String(Math.floor((total%86400)/3600)).padStart(2,'0');document.getElementById('m').textContent=String(Math.floor((total%3600)/60)).padStart(2,'0');document.getElementById('s').textContent=String(total%60).padStart(2,'0')}
  async function check(){const r=role();const released=Date.now()>=RELEASE_AT;if(r==='javi'||(r==='laura'&&released)){try{await loadGame()}catch(e){document.getElementById('copy').textContent='No se ha podido cargar el juego. Vuelve a JaviEats e inténtalo otra vez.';document.getElementById('back').hidden=false}return}const copy=document.getElementById('copy');const cd=document.getElementById('countdown');const back=document.getElementById('back');if(r==='laura'&&!released){copy.textContent='Todavía no 👀 Se desbloquea hoy a las 14:00.';cd.hidden=false;back.hidden=false;updateCountdown();return}copy.textContent='Entra primero en JaviEats con tu perfil para acceder al juego.';cd.hidden=true;back.hidden=false}
  check();
  setInterval(()=>{if(Date.now()<RELEASE_AT)updateCountdown();check()},1000);
})();
</script>
</body>
</html>
