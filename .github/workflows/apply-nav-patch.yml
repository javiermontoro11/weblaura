name: apply-nav-patch

on:
  push:
    paths:
      - '.github/workflows/apply-nav-patch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar ajuste visual
        run: python3 tools/nav_patch.py
      - name: Validar JavaScript
        run: node --check script.js
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "ACTUALIZACION script.js VERSION 3.1"
          git push
