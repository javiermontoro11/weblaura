name: nav-adjust

on:
  push:
    paths:
      - '.github/workflows/nav-adjust.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar navegacion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          old = '''      spark: '<path d="m12 2 1.4 5.1L18 9l-4.6 1.9L12 16l-1.4-5.1L6 9l4.6-1.9L12 2Zm6 12 .8 2.4L21 17l-2.2.6L18 20l-.8-2.4L15 17l2.2-.6L18 14ZM5 14l.8 2.4L8 17l-2.2.6L5 20l-.8-2.4L2 17l2.2-.6L5 14Z"/>',
      clock:'''
          new = '''      spark: '<path d="m12 2 1.4 5.1L18 9l-4.6 1.9L12 16l-1.4-5.1L6 9l4.6-1.9L12 2Zm6 12 .8 2.4L21 17l-2.2.6L18 20l-.8-2.4L15 17l2.2-.6L18 14ZM5 14l.8 2.4L8 17l-2.2.6L5 20l-.8-2.4L2 17l2.2-.6L5 14Z"/>',
      life: '<path d="M10.55 20.45C9.2 19.35 4.1 15.55 4.1 10.95A4.25 4.25 0 0 1 11.5 8.1a4.18 4.18 0 0 1 3.15-1.45c.78 0 1.5.2 2.13.55l-2.35 2.35a2.15 2.15 0 0 0-2.93.9 2.16 2.16 0 0 0-4.18.5c0 2.8 3.26 5.65 4.18 6.4.65-.53 2.45-2.07 3.45-3.9l2.08 1.14c-1.7 2.95-5.1 5.35-6.48 5.86Z"/><path d="M14.7 8.35 20 3.05m-4.45 0H20v4.45" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>',
      clock:'''
          if old not in text:
              raise SystemExit('No se encontro el bloque de iconos esperado')
          text = text.replace(old, new, 1)

          marker = '''  function buildNav() {
    const nav = document.querySelector(".bottom-nav");
    if (!nav) return;
    nav.classList.add("v3-bottom-nav");'''
          replacement = '''  function ensureMainGameNavStyles() {
    if ($("v3-main-game-nav-styles")) return;
    const style = document.createElement("style");
    style.id = "v3-main-game-nav-styles";
    style.textContent = `
      .javieats-v3 .v3-mystery-nav.is-revealed {
        isolation: auto;
        color: #857d75;
      }
      .javieats-v3 .v3-mystery-nav.is-revealed::before,
      .javieats-v3 .v3-mystery-nav.is-revealed::after {
        content: none !important;
        display: none !important;
        animation: none !important;
      }
      .javieats-v3 .v3-mystery-nav.is-revealed .v3-main-game-icon {
        width: 20px;
        height: 20px;
        color: var(--v3-accent, #ef6d60);
        fill: currentColor;
        filter: none;
        transform: none;
      }
      .javieats-v3 .v3-mystery-nav.is-revealed > span {
        margin-top: 0;
        color: #857d75;
        font-size: .56rem;
        font-weight: 850;
        letter-spacing: -.015em;
        white-space: nowrap;
      }
    `;
    document.head.appendChild(style);
  }

  function updateMainGameNavIcon(revealed) {
    const nav = $("v3-mystery-nav");
    if (!nav) return;
    const wantedClass = revealed ? "v3-main-game-icon" : "v3-mystery-spark";
    if (nav.querySelector(`.${wantedClass}`)) return;
    const currentIcon = nav.querySelector("svg");
    const markup = revealed ? icon("life", wantedClass) : icon("spark", wantedClass);
    if (currentIcon) currentIcon.outerHTML = markup;
    else nav.insertAdjacentHTML("afterbegin", markup);
  }

  function buildNav() {
    const nav = document.querySelector(".bottom-nav");
    if (!nav) return;
    nav.classList.add("v3-bottom-nav");
    ensureMainGameNavStyles();'''
          if marker not in text:
              raise SystemExit('No se encontro buildNav esperado')
          text = text.replace(marker, replacement, 1)

          marker = '''    nav.classList.toggle("is-revealed", revealed);

    if (!revealed) {'''
          replacement = '''    nav.classList.toggle("is-revealed", revealed);
    updateMainGameNavIcon(revealed);

    if (!revealed) {'''
          if marker not in text:
              raise SystemExit('No se encontro updateRevealState esperado')
          text = text.replace(marker, replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
          node --check script.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git commit -m "ACTUALIZACION script.js VERSION 3.1"
          git push
